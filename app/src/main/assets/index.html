<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>餐盤熱量計</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one column app — tabs for 估算 / 今日 / 設定, sticky total bar at the bottom. Porcelain-and-cobalt, like a 青花 plate. */
:root{
  --bg:#f3f6fa; --surface:#ffffff; --ink:#18233a; --muted:#5d6a82; --line:#d8e0ec;
  --cobalt:#1f4fa3; --cobalt-soft:#e3ecfa; --left:#c9d4e6; --ok:#2f7d5b; --warn:#b5651d;
  --f-display:"Noto Serif TC","Noto Serif CJK TC","Songti TC",serif;
  --f-body:"Noto Sans TC","Noto Sans CJK TC","PingFang TC",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"Roboto Mono",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 130px;display:grid;gap:20px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
header h1{font-family:var(--f-display);font-weight:900;font-size:28px;margin:0;letter-spacing:.04em}
.label{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;border:none;background:none;padding:8px 0;border-radius:9px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--cobalt);color:#fff}
section{display:grid;gap:12px}
h2{font-family:var(--f-display);font-size:19px;margin:0;font-weight:600}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop{position:relative;aspect-ratio:4/3;max-width:100%;border:1.5px dashed var(--line);border-radius:14px;background:var(--surface);display:grid;place-items:center;text-align:center;overflow:hidden;color:var(--muted)}
.drop input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.drop .tag{position:absolute;left:8px;top:8px;background:var(--surface);color:var(--ink);font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;z-index:1;pointer-events:none}
.drop .hint{padding:12px;font-size:13px;pointer-events:none}
.drop .hint b{display:block;font-size:24px;color:var(--cobalt);font-family:var(--f-display)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px}
.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-weight:700}
.primary:disabled{opacity:.5}
.row-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.status{font-size:13px;color:var(--muted)}
.status.err{color:var(--warn)}
.ai-note{background:var(--cobalt-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.ledger{display:grid;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.item-top{display:flex;gap:8px;align-items:center}
.item-top input.name{flex:1;min-width:0;font:inherit;font-weight:700;font-size:16px;border:none;border-bottom:1px solid transparent;background:transparent;color:var(--ink);padding:2px 0}
.del{border:none;background:none;color:var(--muted);padding:4px 8px;font-size:20px;line-height:1}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fields label{display:grid;gap:2px;font-size:12px;color:var(--muted)}
input[type=number],input[type=password],input[type=text],select{font:inherit;width:100%;min-width:0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.fields input{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.quick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.quick button{padding:4px 11px;font-size:12px;border-radius:99px}
.bar{height:10px;border-radius:99px;background:var(--left);overflow:hidden}
.bar span{display:block;height:100%;background:var(--cobalt);border-radius:99px;transition:width .25s}
.item-foot{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.kcal{font-family:var(--f-num);font-weight:600;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.conf{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.conf.high{color:var(--ok)}.conf.mid{color:var(--muted)}.conf.low{color:var(--warn)}
.add{display:flex;gap:8px}
.add select{flex:1;background:var(--surface);padding:9px 10px;border-radius:10px}
.example{font-size:12px;color:var(--warn);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.card p{margin:0;font-size:14px;color:var(--muted)}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.day-head{display:flex;justify-content:space-between;align-items:baseline}
.day-total{font-family:var(--f-num);font-size:34px;font-weight:600;color:var(--cobalt);font-variant-numeric:tabular-nums}
.meal{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:none}
.meal .what{min-width:0}
.meal .what b{display:block}
.meal .what span{font-size:12px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meal .k{font-family:var(--f-num);font-weight:600;white-space:nowrap}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.total{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.total-in{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.total .big{font-family:var(--f-num);font-weight:600;font-size:28px;font-variant-numeric:tabular-nums;color:var(--cobalt);line-height:1.2}
.total .big small{font-size:14px;color:var(--muted);margin-left:4px}
.total .sub{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;z-index:5}
footer{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="label">飯前一張・飯後一張</div>
      <h1>餐盤熱量計</h1>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="meal" aria-selected="true">估算這餐</button>
    <button role="tab" data-tab="today" aria-selected="false">今日紀錄</button>
    <button role="tab" data-tab="settings" aria-selected="false">設定</button>
  </div>

  <!-- 估算 -->
  <div id="tab-meal" style="display:grid;gap:20px">
    <section>
      <h2>1　拍照</h2>
      <div class="photos">
        <label class="drop" id="dropBefore"><span class="tag">飯前</span><input type="file" id="fileBefore" accept="image/*"><span class="hint"><b>＋</b>拍照或選圖</span></label>
        <label class="drop" id="dropAfter"><span class="tag">飯後</span><input type="file" id="fileAfter" accept="image/*"><span class="hint"><b>＋</b>吃完剩下的樣子</span></label>
      </div>
      <div class="row-actions">
        <button class="primary" id="analyze" disabled>用照片估算</button>
        <button id="clearPhotos">清除照片</button>
      </div>
      <div class="status" id="status"></div>
      <div class="ai-note" id="aiNote" hidden></div>
    </section>

    <section>
      <h2>2　確認食物與份量</h2>
      <div class="example" id="exampleTag">下方是範例資料，估算或新增後會被取代</div>
      <div class="ledger" id="ledger"></div>
      <div class="add">
        <select id="pick" aria-label="從清單加入食物"></select>
        <button id="addBtn">加入</button>
      </div>
    </section>
    <footer>熱量為常見做法的估計值，實際會因份量、油量和食譜而不同。照片估算重量誤差約 ±20–30%，旁邊放筷子或手機當比例尺會更準。</footer>
  </div>

  <!-- 今日 -->
  <div id="tab-today" hidden>
    <div class="card">
      <div class="day-head"><span class="label" id="todayDate"></span><span class="label">今日攝取</span></div>
      <div class="day-total" id="dayTotal">0 大卡</div>
      <div id="mealList"></div>
    </div>
  </div>

  <!-- 設定 -->
  <div id="tab-settings" hidden>
    <div class="card">
      <h2>照片估算設定</h2>
      <p>照片估算使用 Claude API。請到 console.anthropic.com 建立 API 金鑰後貼在這裡。金鑰只存在這支手機上，每次估算會從你的 API 帳戶扣少量費用。</p>
      <label class="field">API 金鑰<input type="password" id="apiKey" placeholder="sk-ant-…" autocomplete="off"></label>
      <label class="field">模型
        <select id="model">
          <option value="claude-sonnet-5-5">Claude Sonnet 5.5（建議，速度與準度平衡）</option>
          <option value="claude-opus-5-5">Claude Opus 5.5（最準，較慢、較貴）</option>
          <option value="claude-haiku-5-5">Claude Haiku 5.5（最快、最便宜）</option>
        </select>
      </label>
      <div class="row-actions"><button class="primary" id="saveKey">儲存設定</button><span class="status" id="keyStatus"></span></div>
    </div>
  </div>
</div>

<div class="total" id="totalBar">
  <div class="total-in">
    <div>
      <div class="label">這餐實際攝取</div>
      <div class="big" id="totalKcal">0<small>大卡</small></div>
      <div class="sub" id="totalSub"></div>
    </div>
    <button class="primary" id="saveMeal">存入今天</button>
  </div>
</div>

<script>
// kcal per 100 g, typical serving in grams
const FOODS = [
  ["白飯",183,200],["糙米飯",165,200],["滷肉飯",230,250],["雞腿便當(含飯)",180,550],["排骨便當(含飯)",190,550],
  ["炒飯",180,300],["炒麵",170,300],["牛肉麵(含湯)",85,700],["陽春麵(含湯)",70,500],["水餃",230,250],
  ["鍋貼",250,200],["小籠包",220,200],["肉包",240,120],["饅頭",230,100],["蛋餅",210,150],
  ["蘿蔔糕",160,150],["油條",390,60],["燒餅",320,90],["吐司",265,60],["三明治",230,150],
  ["漢堡",250,220],["薯條",310,120],["炸雞",290,180],["鹽酥雞",290,150],["滷蛋",150,55],
  ["荷包蛋",200,50],["煎鮭魚",210,120],["烤雞胸",165,120],["炸排骨",280,150],["滷雞腿",210,180],
  ["燙青菜",45,150],["炒青菜",90,150],["生菜沙拉(無醬)",20,150],["豆腐",80,150],["麻婆豆腐",130,200],
  ["味噌湯",30,250],["玉米濃湯",70,250],["珍珠奶茶(全糖)",75,700],["香蕉",90,120],["蘋果",52,200],
  ["蛋糕",380,100],["冰淇淋",210,100],["義大利麵(紅醬)",150,350],["咖哩飯",160,450],["拉麵(含湯)",95,650]
];
const $ = s => document.querySelector(s);
const num = v => Math.max(0, Number(v) || 0);
const r = n => Math.round(n);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const EXAMPLE = () => [
  {name:"滷肉飯",k:230,before:250,after:40,conf:null},
  {name:"燙青菜",k:45,before:150,after:0,conf:null},
  {name:"滷蛋",k:150,before:55,after:0,conf:null},
  {name:"味噌湯",k:30,before:250,after:120,conf:null}
];
let items = EXAMPLE();
let isExample = true;

function toast(t){
  const el = document.createElement("div"); el.className = "toast"; el.textContent = t;
  document.body.append(el); setTimeout(() => el.remove(), 1800);
}

/* ---------- tabs ---------- */
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => showTab(b.dataset.tab));
function showTab(name){
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === name));
  ["meal","today","settings"].forEach(n => $("#tab-"+n).hidden = n !== name);
  $("#tab-meal").style.display = name === "meal" ? "grid" : "none";
  $("#totalBar").hidden = name !== "meal";
  if(name === "today") renderToday();
}

/* ---------- ledger ---------- */
const eatenOf = it => Math.max(0, it.before - Math.min(it.after, it.before));
function totals(){
  const before = items.reduce((s,it)=>s+it.before*it.k/100,0);
  const eaten = items.reduce((s,it)=>s+eatenOf(it)*it.k/100,0);
  return {before, eaten};
}
function render(){
  const L = $("#ledger"); L.textContent = "";
  items.forEach((it,i) => {
    const eatenG = eatenOf(it);
    const pct = it.before ? eatenG / it.before : 0;
    const el = document.createElement("div"); el.className = "item";
    el.innerHTML = `
      <div class="item-top">
        <input class="name" type="text" aria-label="食物名稱">
        ${it.conf ? `<span class="conf ${it.conf}">${{high:"把握高",mid:"把握中",low:"把握低"}[it.conf]}</span>` : ""}
        <button class="del" aria-label="刪除">×</button>
      </div>
      <div class="fields">
        <label>飯前 (g)<input data-f="before" type="number" inputmode="decimal" min="0"></label>
        <label>剩下 (g)<input data-f="after" type="number" inputmode="decimal" min="0"></label>
        <label>大卡/100g<input data-f="k" type="number" inputmode="decimal" min="0"></label>
      </div>
      <div class="quick">剩下約：<button data-p="0">吃光</button><button data-p=".25">¼</button><button data-p=".5">½</button><button data-p=".75">¾</button><button data-p="1">沒動</button></div>
      <div class="bar"><span style="width:${pct*100}%"></span></div>
      <div class="item-foot"><span>吃了 ${r(eatenG)} g・${r(pct*100)}%</span><span class="kcal">${r(eatenG*it.k/100)} 大卡</span></div>`;
    const name = el.querySelector(".name");
    name.value = it.name;
    name.onchange = () => { it.name = name.value; isExample = false; $("#exampleTag").hidden = true; };
    el.querySelectorAll("[data-f]").forEach(inp => {
      inp.value = r(it[inp.dataset.f]);
      inp.onchange = () => { it[inp.dataset.f] = num(inp.value); isExample = false; render(); };
    });
    el.querySelector(".del").onclick = () => { items.splice(i,1); isExample = false; render(); };
    el.querySelectorAll(".quick button").forEach(b => b.onclick = () => { it.after = it.before * Number(b.dataset.p); isExample = false; render(); });
    L.append(el);
  });
  const t = totals();
  $("#totalKcal").innerHTML = `${r(t.eaten)}<small>大卡</small>`;
  $("#totalSub").textContent = items.length ? `整份 ${r(t.before)}・剩下 ${r(t.before-t.eaten)} 大卡` : "加入食物後開始計算";
  $("#exampleTag").hidden = !isExample;
}

const pick = $("#pick");
pick.innerHTML = `<option value="">從常見食物加入…</option>` + FOODS.map((f,i)=>`<option value="${i}">${f[0]}（${f[1]} 大卡/100g）</option>`).join("") + `<option value="custom">自訂食物</option>`;
$("#addBtn").onclick = () => {
  const v = pick.value; if(!v) return;
  if(isExample){ items = []; isExample = false; }
  if(v === "custom") items.push({name:"自訂食物",k:100,before:100,after:0,conf:null});
  else { const f = FOODS[v]; items.push({name:f[0],k:f[1],before:f[2],after:0,conf:null}); }
  pick.value = ""; render();
};

/* ---------- photos ---------- */
const files = {before:null, after:null};
function bindDrop(key, inputId, dropId){
  $(inputId).onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    files[key] = f;
    const d = $(dropId); d.querySelector("img")?.remove();
    const img = document.createElement("img"); img.alt = key === "before" ? "飯前照片" : "飯後照片";
    img.src = URL.createObjectURL(f); d.append(img);
    d.querySelector(".hint").hidden = true;
    updateAnalyze();
  };
}
bindDrop("before","#fileBefore","#dropBefore");
bindDrop("after","#fileAfter","#dropAfter");
$("#clearPhotos").onclick = () => {
  files.before = files.after = null;
  ["#dropBefore","#dropAfter"].forEach(id => { const d=$(id); d.querySelector("img")?.remove(); d.querySelector(".hint").hidden=false; d.querySelector("input").value=""; });
  $("#aiNote").hidden = true;
  updateAnalyze();
};

function setStatus(t, err=false){ const s=$("#status"); s.textContent=t; s.classList.toggle("err",err); }
function updateAnalyze(){
  const key = store.get("apiKey","");
  $("#analyze").disabled = !(key && files.before);
  if(!key) setStatus("要用照片估算，請先到「設定」貼上 API 金鑰。也可以直接用下方清單手動輸入。");
  else if(!files.before) setStatus("放入飯前照片後即可估算。沒有飯後照片時，會當成全部吃完。");
  else setStatus(files.after ? "兩張照片都好了。" : "只有飯前照片，會當成全部吃完。");
}

// Shrink to ~1568 px on the long edge and return base64 JPEG (no prefix)
function toJpegBase64(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const max = 1568, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL("image/jpeg", 0.85).split(",")[1]);
    };
    img.onerror = () => reject(new Error("image"));
    img.src = URL.createObjectURL(file);
  });
}

function parseJson(text){
  try { return JSON.parse(text); } catch {}
  const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(fence) try { return JSON.parse(fence[1]); } catch {}
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  if(a >= 0 && b > a) try { return JSON.parse(text.slice(a, b+1)); } catch {}
  return null;
}

$("#analyze").onclick = async () => {
  const btn = $("#analyze"); btn.disabled = true;
  setStatus("正在看照片，約需 10–40 秒…");
  const both = !!files.after;
  const prompt = `你是營養師。${both ? "第一張照片是用餐前的餐點，第二張是同一份餐點用餐後剩下的樣子。" : "這張照片是用餐前的餐點，假設全部吃完。"}
請辨識每一樣食物，估算：
- before_g：用餐前的重量（公克）
- after_g：用餐後剩下的重量（公克）${both ? "，完全沒剩就是 0" : "，一律填 0"}
- kcal_per_100g：以台灣常見做法估計的每 100 公克熱量
- confidence："high"、"mid" 或 "low"
以餐具、碗盤大小作為比例參考。食物名稱用繁體中文。
只回覆 JSON，不要其他文字，格式：
{"items":[{"name":"滷肉飯","before_g":250,"after_g":40,"kcal_per_100g":230,"confidence":"mid"}],"note":"一句話說明估算依據或注意事項"}`;
  try {
    const imgs = both ? [files.before, files.after] : [files.before];
    const content = [];
    for (const [i, f] of imgs.entries()) {
      content.push({type:"text", text: i === 0 ? "【飯前】" : "【飯後】"});
      content.push({type:"image", source:{type:"base64", media_type:"image/jpeg", data: await toJpegBase64(f)}});
    }
    content.push({type:"text", text: prompt});

    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": store.get("apiKey",""),
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: store.get("model","claude-sonnet-5-5"),
        max_tokens: 2000,
        messages: [{role:"user", content}]
      })
    });
    const body = await res.json().catch(() => ({}));
    if(!res.ok){
      const msg = {401:"API 金鑰不正確，請到「設定」重新貼上。",403:"這把金鑰沒有使用權限。",404:"找不到這個模型，請到「設定」換一個。",429:"太頻繁了，請稍等一下再試。",529:"服務忙碌中，請稍後再試。"}[res.status];
      throw new Error(msg || `估算失敗（${res.status}）：${body?.error?.message || "請稍後再試"}`);
    }
    const text = (body.content || []).filter(b => b.type === "text").map(b => b.text).join("");
    const data = parseJson(text);
    const list = Array.isArray(data?.items) ? data.items : [];
    if(!list.length) throw new Error("照片裡沒有辨識到食物，請換一張或手動加入。");
    items = list.map(x => ({
      name: String(x.name || "食物"),
      before: num(x.before_g), after: num(x.after_g), k: num(x.kcal_per_100g),
      conf: ["high","mid","low"].includes(x.confidence) ? x.confidence : null
    }));
    isExample = false; render();
    const note = $("#aiNote");
    note.textContent = data.note ? String(data.note) : "";
    note.hidden = !data.note;
    setStatus("估算完成，可以直接修改下方的數字。");
  } catch(e) {
    const offline = e instanceof TypeError;
    setStatus(offline ? "連不上網路，請確認網路後再試。" : (e.message === "image" ? "照片無法讀取，請換一張。" : e.message), true);
  } finally {
    $("#analyze").disabled = !(store.get("apiKey","") && files.before);
  }
};

/* ---------- today log ---------- */
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
$("#saveMeal").onclick = () => {
  if(!items.length){ toast("這餐還沒有食物"); return; }
  if(isExample){ toast("這是範例資料，請先拍照或加入食物"); return; }
  const log = store.get("log", {});
  const k = dayKey();
  (log[k] ||= []).push({
    time: new Date().toTimeString().slice(0,5),
    kcal: r(totals().eaten),
    foods: items.map(it => it.name).join("、")
  });
  store.set("log", log);
  toast(`已存入今天：${r(totals().eaten)} 大卡`);
};
function renderToday(){
  const k = dayKey(), log = store.get("log", {}), meals = log[k] || [];
  $("#todayDate").textContent = k;
  $("#dayTotal").textContent = `${meals.reduce((s,m)=>s+m.kcal,0)} 大卡`;
  const list = $("#mealList"); list.textContent = "";
  if(!meals.length){ list.innerHTML = `<div class="empty">今天還沒有紀錄。估算完一餐後，按下方「存入今天」。</div>`; return; }
  meals.forEach((m,i) => {
    const row = document.createElement("div"); row.className = "meal";
    row.innerHTML = `<div class="what"><b></b><span></span></div><div style="display:flex;align-items:center;gap:4px"><span class="k"></span><button class="del" aria-label="刪除這餐">×</button></div>`;
    row.querySelector("b").textContent = m.time;
    row.querySelector(".what span").textContent = m.foods;
    row.querySelector(".k").textContent = `${m.kcal} 大卡`;
    row.querySelector(".del").onclick = () => { meals.splice(i,1); log[k] = meals; store.set("log", log); renderToday(); };
    list.append(row);
  });
}

/* ---------- settings ---------- */
$("#apiKey").value = store.get("apiKey","");
$("#model").value = store.get("model","claude-sonnet-5-5");
$("#saveKey").onclick = () => {
  store.set("apiKey", $("#apiKey").value.trim());
  store.set("model", $("#model").value);
  $("#keyStatus").textContent = "已儲存";
  setTimeout(() => $("#keyStatus").textContent = "", 1500);
  updateAnalyze();
};

render();
updateAnalyze();
</script>
