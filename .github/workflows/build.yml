name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- 1. Food recognition model (rebuilt only when tools/ changes) ----
      - name: Restore food model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/model
          key: food-model-${{ hashFiles('tools/**') }}

      - name: Set up Python
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build food model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install open_clip_torch==3.2.0 timm==1.0.20 onnx==1.18.0 onnxruntime==1.22.1 onnxscript==0.7.2
          python tools/build_model.py

      - name: Check model files
        run: |
          ls -la app/src/main/assets/model
          test -s app/src/main/assets/model/image_encoder.onnx
          test -s app/src/main/assets/model/labels.json

      # ---- 2. Android app ----
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlateMeter-debug-apk
          path: app/build/outputs/apk/debug/*.apk
